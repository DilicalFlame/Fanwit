#:schema https://fanwit.dev/schema/layout-1.json
# Dashboard: one grid node. Each card is a pane placed with a CSS grid area
# (row start / column start / row end / column end); a gallery image opens as a lightbox overlay.
version = 1
preset = "dashboard"

[window.main]
kind = "main"
frame = "workbench"

[window.main.regions]
main = { node = "board" }

[node.board]
type = "grid"
columns = "repeat(4, minmax(0, 1fr))"
rows = "160px minmax(260px, 1fr) minmax(260px, 1fr)"
gap = 10
panes = ["revenue-kpi", "users-kpi", "conversion-kpi", "latency-kpi", "revenue", "regions", "gallery", "traffic", "orders"]

[pane.revenue-kpi]
view = "showcase.dashboard.kpi"
props = { metric = "revenue", label = "Revenue" }

[pane.users-kpi]
view = "showcase.dashboard.kpi"
props = { metric = "users", label = "Active users" }

[pane.conversion-kpi]
view = "showcase.dashboard.kpi"
props = { metric = "conversion", label = "Conversion" }

[pane.latency-kpi]
view = "showcase.dashboard.kpi"
props = { metric = "latency", label = "p95 latency" }

[pane.revenue]
view = "showcase.dashboard.revenue"
area = "2 / 1 / 3 / 4"

[pane.regions]
view = "showcase.dashboard.regions"
area = "2 / 4 / 3 / 5"

[pane.gallery]
view = "showcase.dashboard.gallery"
area = "3 / 1 / 4 / 3"

[pane.traffic]
view = "showcase.dashboard.traffic"
area = "3 / 3 / 4 / 4"

[pane.orders]
view = "showcase.dashboard.orders"
area = "3 / 4 / 4 / 5"
