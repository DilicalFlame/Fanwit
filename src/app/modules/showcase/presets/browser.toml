#:schema https://fanwit.dev/schema/layout-1.json
# Chrome style: the page tabs are drawn in the title bar (the tab set hides its own strip) and the
# address bar sits in the header region below. Tabs are panes: drag one to an edge for side by
# side browsing, or out of the window for a new one.
version = 1
preset = "browser"

[window.main]
kind = "main"
frame = "workbench"

[window.main.regions]
titlebar = { node = "titlebar", size = "40px" }
header = { node = "toolbar", size = "72px" }
main = { node = "pages" }
statusbar = { visible = false }

[node.toolbar]
type = "tabs"
strip = "hidden"
panes = ["toolbar"]

[node.pages]
type = "tabs"
strip = "hidden"
panes = ["start", "wiki"]
active = "start"

[pane.toolbar]
view = "showcase.browser.toolbar"

[pane.start]
view = "showcase.browser.page"
props = { url = "about:newtab" }

[pane.wiki]
view = "showcase.browser.page"
props = { url = "wiki.example/Layout" }

[node.titlebar]
type = "tabs"
strip = "hidden"
panes = ["titlebar"]

[pane.titlebar]
view = "showcase.browser.titlebar"
