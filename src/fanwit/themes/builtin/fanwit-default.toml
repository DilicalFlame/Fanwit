# Fanwit default theme. Every token name follows the shadcn-svelte convention plus workbench tokens.
[meta]
id = "fanwit-default"
name = "Fanwit Default"
author = "Fanwit"
version = "1.0.0"
modes = ["light", "dark"]

[common]
density = "comfortable"
radius = "0.5rem"
border-width = "1px"
font-sans = "\"Inter\", \"Segoe UI\", system-ui, -apple-system, sans-serif"
font-mono = "\"JetBrains Mono\", \"Cascadia Code\", ui-monospace, monospace"
font-size = "13px"
line-height = "1.45"
ui-scale = "1"
duration-fast = "120ms"
duration-base = "200ms"
ease-standard = "cubic-bezier(0.2, 0, 0, 1)"
shadow-sm = "0 1px 2px oklch(0 0 0 / 0.08)"
shadow-md = "0 4px 12px oklch(0 0 0 / 0.12)"
shadow-lg = "0 12px 32px oklch(0 0 0 / 0.18)"

[light]
background = "oklch(1 0 0)"
foreground = "oklch(0.141 0.005 285.823)"
card = "oklch(1 0 0)"
card-foreground = "oklch(0.141 0.005 285.823)"
popover = "oklch(1 0 0)"
popover-foreground = "oklch(0.141 0.005 285.823)"
primary = "oklch(0.21 0.006 285.885)"
primary-foreground = "oklch(0.985 0 0)"
secondary = "oklch(0.967 0.001 286.375)"
secondary-foreground = "oklch(0.21 0.006 285.885)"
muted = "oklch(0.967 0.001 286.375)"
muted-foreground = "oklch(0.552 0.016 285.938)"
accent = "oklch(0.967 0.001 286.375)"
accent-foreground = "oklch(0.21 0.006 285.885)"
destructive = "oklch(0.577 0.245 27.325)"
border = "oklch(0.92 0.004 286.32)"
input = "oklch(0.92 0.004 286.32)"
ring = "oklch(0.705 0.015 286.067)"
chart-1 = "oklch(0.646 0.222 41.116)"
chart-2 = "oklch(0.6 0.118 184.704)"
chart-3 = "oklch(0.398 0.07 227.392)"
chart-4 = "oklch(0.828 0.189 84.429)"
chart-5 = "oklch(0.769 0.188 70.08)"
sidebar = "oklch(0.985 0 0)"
sidebar-foreground = "oklch(0.141 0.005 285.823)"
sidebar-primary = "oklch(0.21 0.006 285.885)"
sidebar-primary-foreground = "oklch(0.985 0 0)"
sidebar-accent = "oklch(0.967 0.001 286.375)"
sidebar-accent-foreground = "oklch(0.21 0.006 285.885)"
sidebar-border = "oklch(0.92 0.004 286.32)"
sidebar-ring = "oklch(0.705 0.015 286.067)"
titlebar = "oklch(0.967 0.001 286.375)"
titlebar-foreground = "oklch(0.21 0.006 285.885)"
activity = "oklch(0.945 0.002 286.32)"
activity-foreground = "oklch(0.552 0.016 285.938)"
activity-active = "oklch(0.21 0.006 285.885)"
tab = "oklch(0.967 0.001 286.375)"
tab-active = "oklch(1 0 0)"
tab-foreground = "oklch(0.21 0.006 285.885)"
tab-border = "oklch(0.55 0.2 260)"
statusbar = "oklch(0.967 0.001 286.375)"
statusbar-foreground = "oklch(0.37 0.013 285.805)"
panel = "oklch(1 0 0)"
splitter = "oklch(0.92 0.004 286.32)"
splitter-hover = "oklch(0.55 0.2 260)"
drop-target = "oklch(0.55 0.2 260 / 0.18)"
selection = "oklch(0.55 0.2 260 / 0.16)"
scrollbar = "oklch(0.552 0.016 285.938 / 0.3)"
scrollbar-hover = "oklch(0.552 0.016 285.938 / 0.55)"
success = "oklch(0.6 0.15 150)"
success-foreground = "oklch(0.985 0 0)"
success-muted = "oklch(0.6 0.15 150 / 0.14)"
warning = "oklch(0.75 0.16 75)"
warning-foreground = "oklch(0.2 0.02 75)"
warning-muted = "oklch(0.75 0.16 75 / 0.16)"
info = "oklch(0.6 0.15 250)"
info-foreground = "oklch(0.985 0 0)"
info-muted = "oklch(0.6 0.15 250 / 0.14)"

[dark]
# Islands style: a dark frame (title, activity and status bars) around slightly lighter
# panels, raised greys for menus and cards, JetBrains blue for actions and focus.
background = "#1e1f22"
foreground = "#dfe1e5"
card = "#2b2d30"
card-foreground = "#dfe1e5"
popover = "#2b2d30"
popover-foreground = "#dfe1e5"
primary = "#3574f0"
primary-foreground = "#ffffff"
secondary = "#393b40"
secondary-foreground = "#dfe1e5"
muted = "#2b2d30"
muted-foreground = "#8c9099"
accent = "#35373c"
accent-foreground = "#dfe1e5"
destructive = "#e55765"
border = "#393b40"
input = "#43454a"
ring = "#3574f0"
sidebar = "#1e1f22"
sidebar-foreground = "#dfe1e5"
sidebar-primary = "#3574f0"
sidebar-primary-foreground = "#ffffff"
sidebar-accent = "#2e436e"
sidebar-accent-foreground = "#ffffff"
sidebar-border = "#393b40"
sidebar-ring = "#3574f0"
titlebar = "#191a1c"
titlebar-foreground = "#ced0d6"
activity = "#191a1c"
activity-foreground = "#8c9099"
activity-active = "#dfe1e5"
tab = "#1e1f22"
tab-active = "#1e1f22"
tab-foreground = "#ced0d6"
tab-border = "#3574f0"
statusbar = "#191a1c"
statusbar-foreground = "#a8abb2"
panel = "#1e1f22"
splitter = "#191a1c"
splitter-hover = "#3574f0"
drop-target = "#3574f038"
selection = "#2e436e"
scrollbar = "oklch(1 0 0 / 0.14)"
scrollbar-hover = "oklch(1 0 0 / 0.26)"
success = "#5fb865"
info = "#3574f0"
warning-foreground = "oklch(0.2 0.02 75)"

[window]
effects = "none"
