info = "oklch(0.6 0.15 250)"
info-foreground = "oklch(0.985 0 0)"
info-muted = "oklch(0.6 0.15 250 / 0.14)"

[dark]
# Nord: blue grey "polar night" panels inside a slightly deeper frame (title, activity and
# status bars, splitters), raised greys for menus and cards, frost blue for actions.
background = "#2e3440"
foreground = "#e5e9f0"
card = "#3b4252"
card-foreground = "#e5e9f0"
popover = "#3b4252"
