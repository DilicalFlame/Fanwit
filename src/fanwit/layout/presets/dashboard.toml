# Dashboard: a grid of cards with a filter drawer.
version = 1
preset = "dashboard"

[window.main]
kind = "main"
frame = "workbench"

[window.main.regions]
main = { node = "grid" }

[node.grid]
type = "grid"
columns = "repeat(3, 1fr)"
rows = "repeat(2, 1fr)"
gap = 8
panes = ["a", "b", "c", "d"]

[pane.a]
view = "fanwit.jobs"
area = "1 / 1 / 2 / 3"

[pane.b]
view = "fanwit.problems"

[pane.c]
view = "fanwit.logs"
area = "2 / 1 / 3 / 4"

[pane.d]
view = "fanwit.contextKeys"
area = "1 / 3 / 2 / 4"
