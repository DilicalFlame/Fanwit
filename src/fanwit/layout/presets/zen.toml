# Zen: distraction free, one tab set, no chrome.
version = 1
preset = "zen"

[window.main]
kind = "main"
frame = "workbench"
zen = true

[window.main.regions]
main = { node = "center" }
activity = { visible = false }
statusbar = { visible = false }

[node.center]
type = "tabs"
panes = ["welcome"]
strip = "hidden"

[pane.welcome]
view = "fanwit.welcome"
