[package]
name = "fanwit-setup"
version = "0.1.0"
description = "Fanwit Setup app: a themed installer that chains the native package (Section 16.9)"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "fanwit-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
fanwit-install = { path = "../install" }
tauri-plugin-dialog = "2"
sha2 = "0.10"
hex = "0.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[features]
# tauri build turns this on: the frontend is embedded instead of served by vite
custom-protocol = ["tauri/custom-protocol"]
