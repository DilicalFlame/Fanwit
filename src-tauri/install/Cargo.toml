[package]
name = "fanwit-install"
version = "1.0.0"
description = "Fanwit Installer Kit engine: check, plan, apply, journal, rollback, receipts (Chapter 16)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fanwit_install"
path = "src/lib.rs"

[[bin]]
name = "fanwit-install"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
regex = "1"
semver = "1"
