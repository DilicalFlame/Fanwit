[package]
name = "fanwit"
version = "0.0.1"
description = "A Tauri App"
authors = ["dilicalflame"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "fanwit"

[lib]
name = "fanwit_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[build-dependencies.tauri-build]
version = "2.5.6"
features = [ "isolation" ]

[dependencies]
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2"
chrono = "0.4.45"
colored = "3.1.1"
tauri-plugin-dialog = "2"
notify = "8"
notify-debouncer-full = "0.5"
toml_edit = "0.22"
dunce = "1.0.5"
trash = "5.2.3"
interprocess = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.10"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

  [dependencies.serde]
  version = "1.0"
  features = [ "derive" ]

  [dependencies.tauri]
  version = "2.10.3"
  features = ["image-png", "isolation", "tray-icon"]

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = { version = "2.4.5", features = ["deep-link"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_Foundation"] }
